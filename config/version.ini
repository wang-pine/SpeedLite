; ============================================================
; speedTest 构建配置
; makeVersion.sh 读取本文件完成版本号注入与多平台交叉编译打包
; ============================================================

[version]
; 版本号（主.次.修订），将拼接进产物文件名与发布标签
major = 1
minor = 1
patch = 0

[app]
; 产物名称前缀
name = speedtest

[platforms]
; 目标平台矩阵：平台名 = GOOS/GOARCH [后缀]
; makeVersion.sh 会为每个平台生成 dest/<平台名>/ 下的二进制
; linux_x86    = linux/386
linux_x64    = linux/amd64
; linux_arm    = linux/arm
; linux_arm64  = linux/arm64
; linux_mips   = linux/mips
; windows_x64  = windows/amd64 .exe
; darwin_x64   = darwin/amd64
; darwin_arm64 = darwin/arm64